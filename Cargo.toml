[package]
name = "skyhawk-rust"
version = "0.1.0"
edition = "2024"

[dependencies]
axum = "0.8.9"
tracing = "0.1.44"
tracing-subscriber = "0.3.23"
rdkafka = "0.39.0"
tokio = { version = "1.53.1", features = ["full"] }
tokio-util = "0.7.19"
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.151"
dotenv = "0.15.0"
sqlx = { version = "0.9.0", default-features = false, features = ["runtime-tokio", "tls-rustls-ring-webpki", "json", "postgres", "macros", "time", "migrate"] }
time = { version = "0.3.55", features = ["macros"] }
dashmap = "6.2.1"
crossbeam-skiplist = "0.1.3"
uuid = { version = "1.24.1", features = ["v4"] }
futures = "0.3.34"
reqwest = { version = "0.13.4", default-features = false, features = ["json", "rustls"] }
thiserror = "2.0.20"
