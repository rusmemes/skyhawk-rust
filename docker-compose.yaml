name: skyhawk
services:
  postgres:
    container_name: postgres
    image: postgres:15.19-alpine
    environment:
      POSTGRES_DB: skyhawk
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: test123
    ports:
      - "5432:5432"
    volumes:
      - "pg-data:/var/lib/postgresql/data"
    networks:
      - skyhawk

  zookeeper:
    container_name: zookeeper
    image: confluentinc/cp-zookeeper:7.8.10
    environment:
      ZOOKEEPER_CLIENT_PORT: 2181
      ZOOKEEPER_TICK_TIME: 2000
    ports:
      - "22181:2181"
    networks:
      - skyhawk

  kafka:
    container_name: kafka
    image: confluentinc/cp-kafka:7.8.10
    depends_on:
      - zookeeper
    ports:
      - "29092:29092"
    environment:
      KAFKA_BROKER_ID: 1
      KAFKA_ZOOKEEPER_CONNECT: zookeeper:2181
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://kafka:9092,PLAINTEXT_HOST://localhost:29092
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: PLAINTEXT:PLAINTEXT,PLAINTEXT_HOST:PLAINTEXT
      KAFKA_INTER_BROKER_LISTENER_NAME: PLAINTEXT
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
    networks:
      - skyhawk

  kafka-init:
    image: confluentinc/cp-kafka:7.8.10
    depends_on:
      - kafka
    command:
      - /bin/bash
      - -c
      - |
        set -e
        cub kafka-ready -b kafka:9092 1 60
        kafka-topics --bootstrap-server kafka:9092 --create --if-not-exists --topic main --partitions 3 --replication-factor 1
        kafka-topics --bootstrap-server kafka:9092 --create --if-not-exists --topic removal --partitions 3 --replication-factor 1
    networks:
      - skyhawk

  back:
    ports:
      - "8080"
    environment:
      DATABASE_URL: postgres://postgres:test123@postgres:5432/skyhawk
      KAFKA_TOPIC_MAIN: main
      KAFKA_TOPIC_REMOVAL: removal
      KAFKA_GROUP_ID: back
      KAFKA_BOOTSTRAP_SERVERS: kafka:9092
    build:
      context: .
      dockerfile: back/Dockerfile
    deploy:
      mode: replicated
      replicas: 2
    restart: always
    depends_on:
      postgres:
        condition: service_started
      zookeeper:
        condition: service_started
      kafka:
        condition: service_started
      kafka-init:
        condition: service_completed_successfully
    networks:
      - skyhawk

  lb:
    container_name: lb
    build: lb
    restart: unless-stopped
    networks:
      - skyhawk
    ports:
      - "8080:8080"

  front:
    ports:
      - "8080"
    environment:
      DATABASE_URL: postgres://postgres:test123@postgres:5432/skyhawk
      KAFKA_TOPIC_MAIN: main
      KAFKA_TOPIC_REMOVAL: removal
      KAFKA_GROUP_ID: random
      KAFKA_BOOTSTRAP_SERVERS: kafka:9092
      SERVICE_DISCOVERY_SELF_URL: docker.host
    build:
      context: .
      dockerfile: front/Dockerfile
    deploy:
      mode: replicated
      replicas: 3
    restart: always
    depends_on:
      postgres:
        condition: service_started
      zookeeper:
        condition: service_started
      kafka:
        condition: service_started
      kafka-init:
        condition: service_completed_successfully
      back:
        condition: service_started
      lb:
        condition: service_started
    networks:
      skyhawk:
        aliases:
          - front

volumes:
  pg-data:

networks:
  skyhawk:
    driver: bridge
